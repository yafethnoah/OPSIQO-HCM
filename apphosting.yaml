# OPSIQO HCM 8.5 V7.9.3 App Hosting configuration.
# Runtime version (nodejs22) and Automatic Base Image Updates are backend settings
# and must be certified separately in Firebase App Hosting Settings.
runConfig:
  minInstances: 1
  maxInstances: 20
  concurrency: 40
  cpu: 1
  memoryMiB: 1024

env:
  - variable: OPSIQO_RELEASE_VERSION
    value: '3.6.1'
  - variable: OPSIQO_PRODUCT_RELEASE
    value: '8.5-v7.9.3'
  - variable: NEXT_PUBLIC_OPSIQO_PRODUCT_RELEASE
    value: '8.5-v7.9.3'
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_OPSIQO_CERTIFICATION_BASELINE
    value: '3.6.1'
    availability: [BUILD, RUNTIME]
  - variable: OPSIQO_DEPLOYMENT_PLATFORM
    value: firebase_app_hosting
    availability: [RUNTIME]
  - variable: OPSIQO_APP_HOSTING_FRAMEWORK_EVIDENCE_REF
    secret: OPSIQO_APP_HOSTING_FRAMEWORK_EVIDENCE_REF
    availability: [RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: opsiqo-hcm-prod-2026
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: opsiqo-hcm-prod-2026
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: '1:303296177079:web:1f1048d8669c6e41323e32'
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: '303296177079'
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: OPSIQO_FIREBASE_WEB_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: OPSIQO_FIREBASE_AUTH_DOMAIN
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_STORAGE_BUCKET
    secret: OPSIQO_FIREBASE_STORAGE_BUCKET
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: OPSIQO_FIREBASE_STORAGE_BUCKET
    availability: [BUILD, RUNTIME]
  - variable: OPSIQO_FIREBASE_ADMIN_AUTH_MODE
    value: adc
    availability: [RUNTIME]
  - variable: APP_BASE_URL
    value: https://opsiqo-hcm-prod--opsiqo-hcm-prod-2026.us-east5.hosted.app
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_APP_BASE_URL
    value: https://opsiqo-hcm-prod--opsiqo-hcm-prod-2026.us-east5.hosted.app
    availability: [BUILD, RUNTIME]
  - variable: OPSIQO_DEMO_MODE
    value: 'false'
  - variable: NEXT_PUBLIC_OPSIQO_DEMO_MODE
    value: 'false'
    availability: [BUILD, RUNTIME]
  - variable: OPSIQO_REQUIRE_APP_CHECK
    value: 'true'
  - variable: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    secret: OPSIQO_FIREBASE_APP_CHECK_SITE_KEY
    availability: [BUILD, RUNTIME]
  - variable: OPSIQO_REQUIRE_ADMIN_MFA
    value: 'false'
  - variable: OPSIQO_REQUIRE_CLEAN_DOCUMENT_SCAN
    value: 'true'
  - variable: OPSIQO_ENABLE_PLATFORM_RELIABILITY
    value: 'true'
  - variable: OPSIQO_BACKUP_EVIDENCE_MODE
    value: firebase_pitr
  - variable: OPSIQO_PLATFORM_MONITORING_SOURCE
    secret: OPSIQO_PLATFORM_MONITORING_SOURCE
  - variable: OPSIQO_PRODUCTION_EVIDENCE_REF
    secret: OPSIQO_PRODUCTION_EVIDENCE_REF
  - variable: OPSIQO_CLOUD_DR_EVIDENCE_REF
    secret: OPSIQO_CLOUD_DR_EVIDENCE_REF
  - variable: OPSIQO_DR_EXERCISE_EVIDENCE_REF
    secret: OPSIQO_DR_EXERCISE_EVIDENCE_REF
  - variable: OPSIQO_JOB_SECRET
    secret: OPSIQO_JOB_SECRET
  - variable: OPSIQO_SURVEY_ANONYMITY_SECRET
    secret: OPSIQO_SURVEY_ANONYMITY_SECRET
  - variable: OPSIQO_REGULATORY_SOURCE_HOSTS
    secret: OPSIQO_REGULATORY_SOURCE_HOSTS
  - variable: OPSIQO_AI_PROVIDER
    value: gemini
  - variable: OPSIQO_REQUIRE_GOVERNED_AI_CONFIG
    value: 'true'
  - variable: GEMINI_API_KEY
    secret: OPSIQO_GEMINI_API_KEY
