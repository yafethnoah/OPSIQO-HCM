# OPSIQO HCM 8.5 V7.9.4.3 — shared Firebase App Hosting defaults.
# IMPORTANT: This base file must remain safe for every App Hosting environment.
# Project IDs, app IDs, public URLs and environment-specific secrets belong in
# apphosting.<environment>.yaml or Firebase Console backend overrides.
runConfig:
  minInstances: 1
  maxInstances: 20
  concurrency: 40
  cpu: 1
  memoryMiB: 1024

env:
  - variable: OPSIQO_RELEASE_VERSION
    value: '3.6.1'

  - variable: OPSIQO_PRODUCT_RELEASE
    value: '8.5-v7.9.4.3'

  - variable: NEXT_PUBLIC_OPSIQO_PRODUCT_RELEASE
    value: '8.5-v7.9.4.3'
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_OPSIQO_CERTIFICATION_BASELINE
    value: '3.6.1'
    availability:
      - BUILD
      - RUNTIME

  - variable: OPSIQO_DEPLOYMENT_PLATFORM
    value: firebase_app_hosting
    availability:
      - RUNTIME

  - variable: OPSIQO_FIREBASE_ADMIN_AUTH_MODE
    value: adc
    availability:
      - RUNTIME

  - variable: OPSIQO_DEMO_MODE
    value: 'false'

  - variable: NEXT_PUBLIC_OPSIQO_DEMO_MODE
    value: 'false'
    availability:
      - BUILD
      - RUNTIME

  - variable: OPSIQO_REQUIRE_ADMIN_MFA
    value: 'true'

  - variable: OPSIQO_REQUIRE_PLATFORM_ADMIN_MFA
    value: 'true'

  - variable: OPSIQO_ALLOW_FIRST_ORG_BOOTSTRAP
    value: 'false'

  - variable: OPSIQO_REQUIRE_CLEAN_DOCUMENT_SCAN
    value: 'true'

  - variable: OPSIQO_AI_PROVIDER
    value: gemini

  - variable: OPSIQO_REQUIRE_GOVERNED_AI_CONFIG
    value: 'true'
