name: OPSIQO Cloud DR Evidence Capture
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: disaster-recovery-evidence
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
      OPSIQO_CLOUD_DR_REQUIRE_PITR: ${{ vars.OPSIQO_CLOUD_DR_REQUIRE_PITR }}
      OPSIQO_CLOUD_DR_REQUIRE_SCHEDULED_BACKUP: ${{ vars.OPSIQO_CLOUD_DR_REQUIRE_SCHEDULED_BACKUP }}
      OPSIQO_CLOUD_DR_MAX_BACKUP_AGE_HOURS: ${{ vars.OPSIQO_CLOUD_DR_MAX_BACKUP_AGE_HOURS }}
    steps:
      - uses: actions/checkout@v6
      - name: Require reviewed lockfile
        run: test -f package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DR_EVIDENCE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Capture Firestore database/PITR metadata
        run: |
          mkdir -p artifacts
          DB="${FIRESTORE_DATABASE_ID:-(default)}"
          gcloud firestore databases describe --project="$FIREBASE_PROJECT_ID" --database="$DB" --format=json > artifacts/firestore-database.json
      - name: Capture backup schedule metadata
        run: |
          DB="${FIRESTORE_DATABASE_ID:-(default)}"
          gcloud firestore backups schedules list --project="$FIREBASE_PROJECT_ID" --database="$DB" --format=json > artifacts/firestore-backup-schedules.json
      - name: Capture available backup metadata
        run: gcloud firestore backups list --project="$FIREBASE_PROJECT_ID" --format=json > artifacts/firestore-backups.json
      - name: Assess Cloud DR evidence
        run: npm run cloud:dr:capture
      - uses: actions/upload-artifact@v4
        with:
          name: opsiqo-cloud-dr-evidence-${{ github.run_id }}
          retention-days: 90
          path: |
            artifacts/firestore-database.json
            artifacts/firestore-backup-schedules.json
            artifacts/firestore-backups.json
            artifacts/opsiqo-cloud-dr-evidence.json
