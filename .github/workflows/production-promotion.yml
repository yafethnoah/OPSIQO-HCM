name: OPSIQO HCM Production Promotion Gate
on:
  workflow_dispatch:
    inputs:
      certification_ref:
        description: Protected certification branch or ref approved for production
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      NODE_ENV: production
      OPSIQO_RELEASE_VERSION: '3.6.1'
      OPSIQO_PRODUCT_RELEASE: '8.5-v7.9.3'
      OPSIQO_SOURCE_COMMIT: ${{ github.sha }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      OPSIQO_FIREBASE_ADMIN_AUTH_MODE: adc
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      NEXT_PUBLIC_APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      OPSIQO_REQUIRE_APP_CHECK: 'true'
      NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_APP_CHECK_SITE_KEY }}
      OPSIQO_REQUIRE_ADMIN_MFA: 'true'
      OPSIQO_REQUIRE_CLEAN_DOCUMENT_SCAN: 'true'
      OPSIQO_JOB_SECRET: ${{ secrets.OPSIQO_JOB_SECRET }}
      OPSIQO_SURVEY_ANONYMITY_SECRET: ${{ secrets.OPSIQO_SURVEY_ANONYMITY_SECRET }}
      OPSIQO_REGULATORY_SOURCE_HOSTS: ${{ vars.OPSIQO_REGULATORY_SOURCE_HOSTS }}
      OPSIQO_ENABLE_ENTERPRISE_SSO: ${{ vars.OPSIQO_ENABLE_ENTERPRISE_SSO }}
      OPSIQO_IDENTITY_HOSTS: ${{ vars.OPSIQO_IDENTITY_HOSTS }}
      OPSIQO_ALLOWED_ADMIN_PROVIDERS: ${{ vars.OPSIQO_ALLOWED_ADMIN_PROVIDERS }}
      OPSIQO_ENABLE_SECURITY_OPERATIONS: ${{ vars.OPSIQO_ENABLE_SECURITY_OPERATIONS }}
      OPSIQO_SECURITY_EVENT_INGEST_SECRET: ${{ secrets.OPSIQO_SECURITY_EVENT_INGEST_SECRET }}
      OPSIQO_SECURITY_EVENT_INGEST_ORG_ID: ${{ vars.OPSIQO_JOB_ORG_ID }}
      OPSIQO_SECURITY_EVENT_INGEST_SECRETS_JSON: ${{ secrets.OPSIQO_SECURITY_EVENT_INGEST_SECRETS_JSON }}
      OPSIQO_SECURITY_SIEM_HOSTS: ${{ vars.OPSIQO_SECURITY_SIEM_HOSTS }}
      OPSIQO_ENABLE_EXTERNAL_INTEGRATIONS: ${{ vars.OPSIQO_ENABLE_EXTERNAL_INTEGRATIONS }}
      OPSIQO_INTEGRATION_HOSTS: ${{ vars.OPSIQO_INTEGRATION_HOSTS }}
      OPSIQO_ENABLE_PLATFORM_RELIABILITY: 'true'
      OPSIQO_BACKUP_EVIDENCE_MODE: ${{ vars.OPSIQO_BACKUP_EVIDENCE_MODE }}
      OPSIQO_PLATFORM_MONITORING_SOURCE: ${{ vars.OPSIQO_PLATFORM_MONITORING_SOURCE }}
      OPSIQO_PRODUCTION_EVIDENCE_REF: ${{ vars.OPSIQO_PRODUCTION_EVIDENCE_REF }}
      OPSIQO_CLOUD_DR_EVIDENCE_REF: ${{ vars.OPSIQO_CLOUD_DR_EVIDENCE_REF }}
      OPSIQO_DR_EXERCISE_EVIDENCE_REF: ${{ vars.OPSIQO_DR_EXERCISE_EVIDENCE_REF }}
      OPSIQO_DEPLOYMENT_PLATFORM: firebase_app_hosting
      OPSIQO_APP_HOSTING_FRAMEWORK_EVIDENCE_REF: ${{ vars.OPSIQO_APP_HOSTING_FRAMEWORK_EVIDENCE_REF }}
      OPSIQO_AI_PROVIDER: ${{ vars.OPSIQO_AI_PROVIDER }}
      OPSIQO_REQUIRE_GOVERNED_AI_CONFIG: 'true'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPSIQO_JOB_ORG_ID: ${{ vars.OPSIQO_JOB_ORG_ID }}
    steps:
      - name: Require protected certification ref
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ vars.OPSIQO_CERTIFICATION_BRANCH }}"
          test "${{ github.ref_name }}" = "${{ vars.OPSIQO_CERTIFICATION_BRANCH }}"
          test "${{ inputs.certification_ref }}" = "${{ vars.OPSIQO_CERTIFICATION_BRANCH }}"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.certification_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require approved production evidence references
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPSIQO_PRODUCTION_EVIDENCE_REF:-}"
          test -n "${OPSIQO_CLOUD_DR_EVIDENCE_REF:-}"
          test -n "${OPSIQO_DR_EXERCISE_EVIDENCE_REF:-}"
          test -n "${OPSIQO_APP_HOSTING_FRAMEWORK_EVIDENCE_REF:-}"
      - name: Verify frozen source before dependency install
        run: node scripts/source-manifest.mjs verify
      - name: Review committed lockfile before dependency install
        run: node scripts/review-lockfile.mjs --artifact artifacts/production-promotion-lockfile-review.json
      - name: Authenticate to Google Cloud using OIDC / Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Production preflight
        run: npm run preflight:production
      - name: Run production certification
        shell: pwsh
        run: ./RUN_OPSIQO_8_5_V7_9_2_PRODUCTION_CERTIFICATION.ps1 -SkipCodeCertification
      - name: Package build for provenance
        run: tar -czf opsiqo-build.tgz .next
      - run: npm run supplychain:provenance -- opsiqo-build.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: opsiqo-v7.9.3-production-evidence
          path: |
            artifacts/opsiqo-hcm.cdx.json
            artifacts/opsiqo-hcm.provenance.json
            opsiqo-build.tgz
  integrated-uat:
    needs: verify-and-promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      OPSIQO_UAT_BASE_URL: ${{ vars.OPSIQO_UAT_BASE_URL }}
      OPSIQO_UAT_ORG_ID: ${{ vars.OPSIQO_JOB_ORG_ID }}
      OPSIQO_UAT_ID_TOKEN: ${{ secrets.OPSIQO_UAT_ID_TOKEN }}
      OPSIQO_UAT_APP_CHECK_TOKEN: ${{ secrets.OPSIQO_UAT_APP_CHECK_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - run: npm run uat:lifecycle
