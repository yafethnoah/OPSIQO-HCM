title = "OPSIQO narrowly scoped Gitleaks false-positive controls"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Browser appearance localStorage identifier is not a credential"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^src/lib/preferences/appearance\.ts$'''
  ]
  regexes = [
    '''^\s*export const APPEARANCE_STORAGE_KEY='opsiqo\.appearance\.v1';\s*$'''
  ]

  [[rules.allowlists]]
  description = "Gantt experiment feature-flag identifier is not a credential"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^src/lib/experimentation/flagCatalog\.ts$'''
  ]
  regexes = [
    '''^\s*key:\s*"opsiqo_exp_gantt_density_v2",\s*$'''
  ]